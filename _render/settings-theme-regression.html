<!doctype html><meta charset="utf-8"><style>body{margin:0}iframe{border:0;width:100vw;height:100vh}pre{position:fixed;bottom:0;background:#111;color:#fff;font:12px monospace;z-index:99999}</style><iframe id="frame"></iframe><pre id="results">RUNNING</pre><script type="module">
const realm=new URLSearchParams(location.search).get('realm')||'beatrice';const frame=document.querySelector('#frame');frame.src=`harness.html?shot=${realm==='void'?'void&stay=1':'config'}`;
frame.addEventListener('load',()=>setTimeout(()=>{const out=document.querySelector('#results'),d=frame.contentDocument,w=frame.contentWindow;const checks=[];function check(label,ok){checks.push(`${ok?'PASS':'FAIL'} ${label}`);if(!ok)throw Error(label)}try{d.querySelectorAll('#dbg,#debug,#void-results,#probe').forEach(n=>n.remove());const overlay=d.querySelector('.bg-win-overlay'),card=d.querySelector('.bg-win-card'),panel=d.querySelector('.bg-win-panel');check('settings opened',overlay?.dataset.open==='1');const css=w.getComputedStyle(overlay);check('realm palette',css.getPropertyValue('--bg-ui-surface').trim()===(realm==='void'?'#f5f7f9':'#281f30'));check('card fits viewport',card.getBoundingClientRect().left>=0 && card.getBoundingClientRect().right<=w.innerWidth && card.getBoundingClientRect().height<=w.innerHeight);check('panel has no horizontal overflow',panel.scrollWidth<=panel.clientWidth+1);check('primary matches palette',w.getComputedStyle(d.querySelector('.bg-btn-primary')).backgroundColor===(realm==='void'?'rgb(80, 101, 121)':'rgb(240, 207, 159)'));check('portrait original no filter',w.getComputedStyle(d.querySelector('.bg-win-portrait')).filter==='none');check('inputs keyboard focus',!!d.querySelector('.bg-input,.bg-select'));out.textContent=checks.join('\n');out.dataset.result='passed';if(new URLSearchParams(location.search).has('preview'))out.hidden=true;}catch(e){out.textContent=checks.join('\n')+'\n'+e.message;out.dataset.result='failed'}},1600));
</script>
